<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Plate Pro - Cafe System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
/* ============================================================
   DESIGN SYSTEM — Plate Pro (مبسط)
   ============================================================ */
:root {
    --gold: #C9A050;
    --gold-glow: rgba(201, 160, 80, 0.25);
    --navy: #1A1A2E;
    --cream: #F8F6F0;
    --bg: var(--cream);
    --surface: #FFFFFF;
    --border: #E5E2D9;
    --border-strong: #C9C4B8;
    --text: var(--navy);
    --text-dim: #6B6B80;
    --text-faint: #9A9AAE;
    --success: #2D9B4E;
    --danger: #DC3545;
    --radius-sm: 8px;
    --radius-md: 14px;
    --radius-lg: 20px;
    --font-display: 'Cairo', sans-serif;
    --font-mono: 'JetBrains Mono', monospace;
    --ease: cubic-bezier(0.16, 1, 0.3, 1);
    --shadow-md: 0 4px 20px rgba(26, 26, 46, 0.08);
    --shadow-gold: 0 4px 24px rgba(201, 160, 80, 0.3);
}

* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    font-family: var(--font-display);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding-bottom: 80px;
}
.screen { display: none; min-height: 100vh; }
.screen.active { display: block; }
.centered-screen {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    text-align: center;
}
.brand-mark {
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.3em;
    color: var(--gold);
    text-transform: uppercase;
    margin-bottom: 4px;
}
.brand-title {
    font-size: 28px;
    font-weight: 900;
    color: var(--navy);
    margin-bottom: 24px;
}
.brand-title .gold { color: var(--gold); }
.card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 24px;
    width: 100%;
    max-width: 400px;
    box-shadow: var(--shadow-md);
}
.field {
    margin-bottom: 16px;
    text-align: right;
}
.field label {
    display: block;
    font-size: 12.5px;
    color: var(--text-dim);
    margin-bottom: 6px;
    font-weight: 600;
}
.field input {
    width: 100%;
    padding: 13px 16px;
    background: #F0EDE6;
    border: 2px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text);
    font-size: 15px;
    outline: none;
    font-family: var(--font-display);
}
.field input:focus {
    border-color: var(--gold);
    box-shadow: 0 0 0 4px var(--gold-glow);
}
.field input.mono { font-family: var(--font-mono); }
.btn {
    border: none;
    border-radius: var(--radius-sm);
    font-weight: 700;
    font-size: 14.5px;
    cursor: pointer;
    padding: 14px 24px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: transform 0.15s var(--ease);
}
.btn:active { transform: scale(0.97); }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }
.btn-block { width: 100%; }
.btn-gold {
    background: var(--gold);
    color: #fff;
    box-shadow: var(--shadow-gold);
}
.btn-ghost {
    background: transparent;
    border: 1px solid var(--border-strong);
    color: var(--text);
}
.btn-ghost:hover { background: #F0EDE6; }
.error-text { color: var(--danger); font-size: 13px; margin-top: 8px; min-height: 18px; }
.toast {
    position: fixed;
    bottom: 90px;
    left: 16px;
    right: 16px;
    max-width: 480px;
    margin: 0 auto;
    padding: 14px 20px;
    border-radius: var(--radius-sm);
    font-weight: 700;
    font-size: 14px;
    text-align: center;
    z-index: 999;
    display: none;
    color: #fff;
}
.toast.success { background: var(--success); }
.toast.error { background: var(--danger); }
.mono { font-family: var(--font-mono); }
</style>
</head>
<body>

<!-- ============================================================
   SETUP SCREEN
   ============================================================ -->
<div id="setupScreen" class="screen active">
    <div class="centered-screen">
        <div class="brand-mark">PLATE PRO</div>
        <div class="brand-title">
            <span class="gold">✦</span> تسجيل الدخول <span class="gold">✦</span>
        </div>
        <div class="card">
            <div class="field">
                <label>كود النشاط التجاري</label>
                <input type="text" id="setupBusinessCode" class="mono" placeholder="مثال: CAFE01" style="text-transform:uppercase">
            </div>
            <button class="btn btn-gold btn-block" id="setupContinueBtn">
                <i class="fa-solid fa-arrow-left"></i> متابعة
            </button>
            <div class="error-text" id="setupError"></div>
        </div>
    </div>
</div>

<!-- ============================================================
   ACTIVATION SCREEN
   ============================================================ -->
<div id="activationScreen" class="screen">
    <div class="centered-screen">
        <div class="brand-mark">PLATE PRO</div>
        <div class="brand-title" id="activationBizName">—</div>
        <div class="card">
            <p style="color:var(--text-dim);font-size:13px;margin-bottom:16px;">
                الجهاز ده لسه مش مفعّل على النشاط ده. أدخل كود التفعيل اللي معاك.
            </p>
            <div class="field">
                <label>كود التفعيل</label>
                <input type="text" id="activationCodeInput" class="mono" placeholder="XXXX-XXXX" style="text-transform:uppercase">
            </div>
            <button class="btn btn-gold btn-block" id="activateBtn">
                <i class="fa-solid fa-check"></i> تفعيل
            </button>
            <button class="btn btn-ghost btn-block" style="margin-top:8px;" id="backToSetupBtn">رجوع</button>
            <div class="error-text" id="activationError"></div>
        </div>
    </div>
</div>

<!-- ============================================================
   LOCK SCREEN
   ============================================================ -->
<div id="lockScreen" class="screen">
    <div class="centered-screen">
        <div class="brand-mark" id="lockBizCode">—</div>
        <div class="brand-title" id="lockBizName">—</div>
        <div class="card">
            <div id="lockRoleChoice">
                <label style="display:block;margin-bottom:12px;font-weight:600;">هل انت؟</label>
                <button class="btn btn-gold btn-block" style="margin-bottom:10px;" id="lockOwnerBtn">
                    <i class="fa-solid fa-user-shield"></i> المالك / الأدمن
                </button>
                <button class="btn btn-ghost btn-block" id="lockEmployeeBtn">
                    <i class="fa-solid fa-user"></i> موظف
                </button>
            </div>

            <div id="lockOwnerForm" style="display:none;">
                <div class="field">
                    <label>PIN المالك</label>
                    <input type="password" inputmode="numeric" id="lockPinInput" class="mono" placeholder="••••" style="text-align:center;letter-spacing:0.4em;font-size:22px;">
                </div>
                <button class="btn btn-gold btn-block" id="unlockOwnerBtn">
                    <i class="fa-solid fa-unlock"></i> دخول
                </button>
                <button class="btn btn-ghost btn-block" style="margin-top:10px;" id="resetLockBtn">رجوع</button>
            </div>

            <div id="lockEmployeeForm" style="display:none;">
                <div class="field">
                    <label>اسمك</label>
                    <input type="text" id="lockEmpName" placeholder="">
                </div>
                <div class="field">
                    <label>PIN الموظف</label>
                    <input type="password" inputmode="numeric" id="lockEmpPin" class="mono" placeholder="••••" style="text-align:center;letter-spacing:0.4em;font-size:22px;">
                </div>
                <button class="btn btn-gold btn-block" id="unlockEmpBtn">
                    <i class="fa-solid fa-unlock"></i> دخول
                </button>
                <button class="btn btn-ghost btn-block" style="margin-top:10px;" id="resetLockEmpBtn">رجوع</button>
            </div>

            <div class="error-text" id="lockError"></div>
        </div>
        <div style="margin-top:14px;font-size:12px;color:var(--text-faint);" class="mono" id="subStatusLine"></div>
    </div>
</div>

<!-- ============================================================
   MAIN APP (مبسط)
   ============================================================ -->
<div id="mainApp" class="screen">
    <div style="padding:20px;max-width:640px;margin:0 auto;">
        <h1 id="headerBizName" style="font-size:24px;font-weight:900;color:var(--gold);">—</h1>
        <p style="color:var(--text-dim);">مرحباً بك في نظام إدارة المطاعم والكافيهات</p>
        <button class="btn btn-ghost btn-block" style="margin-top:20px;" id="lockAppBtn">
            <i class="fa-solid fa-lock"></i> قفل التطبيق
        </button>
    </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ============================================================
// CONFIG — تعريف supabase مرة واحدة فقط!
// ============================================================
const SUPABASE_URL = 'https://bccuzjjnrqnmqwcypucr.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_X3pnp718gcVx9-wrisvtHw_44hMVVZ_';

// IMPORTANT: Use a different variable name to avoid conflicts
let supabaseClient = null;

// Initialize Supabase only once
try {
    supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    console.log('✅ Supabase initialized successfully');
} catch (e) {
    console.error('❌ Failed to initialize Supabase:', e);
}

// ============================================================
// STATE
// ============================================================
let business = null;
let deviceRecord = null;
let currentUser = null;

// ============================================================
// UTILITIES
// ============================================================
function showToast(msg, type = 'success') {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.className = 'toast ' + type;
    el.style.display = 'block';
    clearTimeout(el._t);
    el._t = setTimeout(() => { el.style.display = 'none'; }, 2600);
}

function showScreen(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
}

function getDeviceId() {
    let id = localStorage.getItem('platepro_device_id');
    if (!id) {
        id = 'dev_' + Math.random().toString(36).slice(2) + Date.now().toString(36);
        localStorage.setItem('platepro_device_id', id);
    }
    return id;
}

// ============================================================
// SETUP
// ============================================================
async function handleSetupContinue() {
    const code = document.getElementById('setupBusinessCode').value.trim().toUpperCase();
    const errEl = document.getElementById('setupError');
    errEl.textContent = '';
    if (!code) { errEl.textContent = 'اكتب كود النشاط.'; return; }
    
    const btn = document.getElementById('setupContinueBtn');
    btn.disabled = true;
    
    try {
        if (!supabaseClient) {
            errEl.textContent = 'Supabase not initialized.';
            return;
        }
        
        const { data: biz, error } = await supabaseClient.from('businesses').select('*').eq('code', code).single();
        if (error || !biz) { errEl.textContent = 'مفيش نشاط بالكود ده.'; return; }
        business = biz;
        localStorage.setItem('platepro_business_code', code);

        const deviceId = getDeviceId();
        const { data: dev } = await supabaseClient.from('devices').select('*').eq('business_id', biz.id).eq('device_id', deviceId).maybeSingle();
        
        if (!dev) {
            document.getElementById('activationBizName').textContent = biz.name;
            showScreen('activationScreen');
            return;
        }
        deviceRecord = dev;
        proceedToLock();
    } catch (e) {
        console.error(e);
        errEl.textContent = 'حصل خطأ في الاتصال، حاول تاني.';
    } finally { btn.disabled = false; }
}

// ============================================================
// ACTIVATION
// ============================================================
async function handleActivateDevice() {
    const code = document.getElementById('activationCodeInput').value.trim().toUpperCase();
    const errEl = document.getElementById('activationError');
    errEl.textContent = '';
    if (!code) { errEl.textContent = 'اكتب كود التفعيل.'; return; }
    
    try {
        if (!supabaseClient) {
            errEl.textContent = 'Supabase not initialized.';
            return;
        }
        
        const { data: actCode, error } = await supabaseClient.from('activation_codes').select('*').eq('business_id', business.id).eq('code', code).eq('used', false).single();
        if (error || !actCode) { errEl.textContent = 'الكود غير صحيح أو مستخدم قبل كده.'; return; }

        const deviceId = getDeviceId();
        const expiry = new Date(); expiry.setDate(expiry.getDate() + 30);
        const { data: newDev, error: devErr } = await supabaseClient.from('devices').insert({
            business_id: business.id,
            device_id: deviceId,
            device_label: 'جهاز جديد',
            is_active: true,
            revoked: false,
            expiry_date: expiry.toISOString()
        }).select().single();
        
        if (devErr) { errEl.textContent = 'فشل التفعيل، حاول تاني.'; return; }

        await supabaseClient.from('activation_codes').update({ used: true, used_at: new Date().toISOString() }).eq('id', actCode.id);
        deviceRecord = newDev;
        showToast('تم تفعيل الجهاز بنجاح', 'success');
        proceedToLock();
    } catch (e) {
        console.error(e);
        errEl.textContent = 'حصل خطأ، حاول تاني.';
    }
}

// ============================================================
// LOCK
// ============================================================
function proceedToLock() {
    document.getElementById('lockBizCode').textContent = business.code;
    document.getElementById('lockBizName').textContent = business.name;
    
    const expiry = deviceRecord.expiry_date ? new Date(deviceRecord.expiry_date) : null;
    const subLine = document.getElementById('subStatusLine');
    if (deviceRecord.revoked || !deviceRecord.is_active) {
        subLine.textContent = 'الجهاز موقوف — تواصل مع الإدارة';
    } else if (expiry && expiry < new Date()) {
        subLine.textContent = 'الاشتراك منتهي — تواصل مع الإدارة';
    } else if (expiry) {
        const days = Math.ceil((expiry - new Date()) / 86400000);
        subLine.textContent = `متبقي ${days} يوم على الاشتراك`;
    }
    resetLockRole();
    showScreen('lockScreen');
}

function selectLockRole(role) {
    document.getElementById('lockError').textContent = '';
    document.getElementById('lockRoleChoice').style.display = 'none';
    document.getElementById('lockOwnerForm').style.display = role === 'owner' ? 'block' : 'none';
    document.getElementById('lockEmployeeForm').style.display = role === 'employee' ? 'block' : 'none';
}

function resetLockRole() {
    document.getElementById('lockError').textContent = '';
    document.getElementById('lockPinInput').value = '';
    document.getElementById('lockEmpName').value = '';
    document.getElementById('lockEmpPin').value = '';
    document.getElementById('lockOwnerForm').style.display = 'none';
    document.getElementById('lockEmployeeForm').style.display = 'none';
    document.getElementById('lockRoleChoice').style.display = 'block';
}

async function handleEmployeeUnlock() {
    const name = document.getElementById('lockEmpName').value.trim();
    const pin = document.getElementById('lockEmpPin').value.trim();
    const errEl = document.getElementById('lockError');
    errEl.textContent = '';
    
    if (deviceRecord.revoked || !deviceRecord.is_active) { errEl.textContent = 'الجهاز موقوف.'; return; }
    if (deviceRecord.expiry_date && new Date(deviceRecord.expiry_date) < new Date()) { errEl.textContent = 'الاشتراك منتهي.'; return; }
    if (!name || !pin) { errEl.textContent = 'اكتب الاسم والـ PIN.'; return; }

    if (!supabaseClient) { errEl.textContent = 'Supabase not initialized.'; return; }
    
    const { data: emps, error } = await supabaseClient.from('employees').select('*').eq('business_id', business.id).eq('is_active', true);
    if (error) { errEl.textContent = 'حصل خطأ، حاول تاني.'; return; }
    
    const emp = (emps || []).find(e => e.name && e.name.trim().toLowerCase() === name.toLowerCase() && String(e.pin) === pin);
    if (emp) {
        currentUser = { type: 'employee', ...emp };
        enterMainApp();
        return;
    }
    errEl.textContent = 'الاسم أو الـ PIN غير صحيح.';
}

async function handleUnlock() {
    const pin = document.getElementById('lockPinInput').value.trim();
    const errEl = document.getElementById('lockError');
    errEl.textContent = '';
    
    if (deviceRecord.revoked || !deviceRecord.is_active) { errEl.textContent = 'الجهاز موقوف.'; return; }
    if (deviceRecord.expiry_date && new Date(deviceRecord.expiry_date) < new Date()) { errEl.textContent = 'الاشتراك منتهي.'; return; }
    if (!pin) { errEl.textContent = 'اكتب الـ PIN.'; return; }

    if (pin === business.owner_pin) {
        currentUser = { type: 'owner', name: 'المالك' };
        enterMainApp();
        return;
    }
    
    if (!supabaseClient) { errEl.textContent = 'Supabase not initialized.'; return; }
    
    const { data: emp } = await supabaseClient.from('employees').select('*').eq('business_id', business.id).eq('pin', pin).eq('is_active', true).maybeSingle();
    if (emp) {
        currentUser = { type: 'employee', ...emp };
        enterMainApp();
        return;
    }
    errEl.textContent = 'PIN غير صحيح.';
}

function lockApp() {
    currentUser = null;
    document.getElementById('lockPinInput').value = '';
    proceedToLock();
}

// ============================================================
// MAIN APP
// ============================================================
function enterMainApp() {
    document.getElementById('headerBizName').textContent = business.name;
    showScreen('mainApp');
    showToast(`مرحباً ${currentUser.name || ''}!`, 'success');
}

// ============================================================
// BIND EVENTS
// ============================================================
document.addEventListener('DOMContentLoaded', function() {
    // Setup
    document.getElementById('setupContinueBtn').addEventListener('click', handleSetupContinue);
    
    // Activation
    document.getElementById('activateBtn').addEventListener('click', handleActivateDevice);
    document.getElementById('backToSetupBtn').addEventListener('click', function() {
        showScreen('setupScreen');
    });
    
    // Lock
    document.getElementById('lockOwnerBtn').addEventListener('click', function() {
        selectLockRole('owner');
    });
    document.getElementById('lockEmployeeBtn').addEventListener('click', function() {
        selectLockRole('employee');
    });
    document.getElementById('unlockOwnerBtn').addEventListener('click', handleUnlock);
    document.getElementById('unlockEmpBtn').addEventListener('click', handleEmployeeUnlock);
    document.getElementById('resetLockBtn').addEventListener('click', resetLockRole);
    document.getElementById('resetLockEmpBtn').addEventListener('click', resetLockRole);
    
    // Main App
    document.getElementById('lockAppBtn').addEventListener('click', lockApp);
    
    // Auto-resume
    tryAutoResume();
});

// ============================================================
// AUTO-RESUME
// ============================================================
async function tryAutoResume() {
    const code = localStorage.getItem('platepro_business_code');
    if (!code) return;
    try {
        if (!supabaseClient) return;
        const { data: biz } = await supabaseClient.from('businesses').select('*').eq('code', code).single();
        if (!biz) return;
        business = biz;
        const { data: dev } = await supabaseClient.from('devices').select('*').eq('business_id', biz.id).eq('device_id', getDeviceId()).maybeSingle();
        if (!dev) return;
        deviceRecord = dev;
        proceedToLock();
    } catch (e) { 
        console.warn('auto-resume failed', e); 
        localStorage.removeItem('platepro_business_code');
    }
}

console.log('🍽️ Plate Pro — Cafe System');
console.log('✅ All functions loaded successfully!');
</script>
</body>
</html>
